[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop-engine"
version = "0.1.0"
description = "A self-advancing loop for AI agents: read state, run quality gates, decide one bounded action, journal it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Homayoun Safarpour", email = "homayoun.safarpour@gmail.com" }]
keywords = ["agentic-ai", "ai-engineering", "agent-loop", "llm-agents", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
loop-engine = "loopengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Pin the rule set so lint results are identical on every machine and in CI.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Literal expected values in assertions are the point of a test, not a smell.
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
